# Update server + Caddy (HTTPS). Already running a reverse proxy? Start only `server` and proxy to
# 127.0.0.1:$SERVER_PORT (see deploy/Caddyfile.host). Homelab variant: README "Deployment".
services:
  server:
    build: .
    env_file: .env
    volumes: [data:/data]
    # Only reachable from this host (for a host-level reverse proxy); the bundled Caddy uses the compose network.
    ports: ["127.0.0.1:${SERVER_PORT:-8080}:8080"]
    restart: unless-stopped
  caddy:
    image: caddy:2
    ports: ["80:80", "443:443"]
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in .env}
      UPSTREAM: ${UPSTREAM:-server:8080}
    volumes: [./deploy/Caddyfile:/etc/caddy/Caddyfile:ro, caddy:/data]
    restart: unless-stopped
volumes:
  data: {}
  caddy: {}
